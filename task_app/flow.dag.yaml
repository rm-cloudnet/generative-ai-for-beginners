inputs:
  question:
    type: string
    default: "I need to buy milk"

outputs:
  answer:
    type: string
    reference: ${process_task.output}

nodes:
- name: classify_intent
  type: python
  source:
    type: code
    path: classify.py
  inputs:
    # Use ${inputs.question} instead of ${question}
    question: ${inputs.question} 

- name: process_task
  type: python
  source:
    type: code
    path: tasks.py
  inputs:
    # References to other nodes use ${node_name.output}
    intent_output: ${classify_intent.output}
























